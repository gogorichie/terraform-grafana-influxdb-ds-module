name: Release

on:
  # Draft/update the next release notes whenever main moves.
  push:
    branches:
      - main
  # Once a release is published, move the major-version tag (v1, v2, ...).
  release:
    types: [published]

permissions:
  contents: write

jobs:
  draft-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - uses: patrickjahns/version-drafter-action@v1.3.1
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: release-drafter/release-drafter@v7.3.1
        with:
          version: ${{ format('v{0}', steps.version.outputs.next-version) }}
          tag: ${{ format('v{0}', steps.version.outputs.next-version) }}
          name: ${{ format('v{0}', steps.version.outputs.next-version) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag-major-version:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: Actions-R-Us/actions-tagger@v2.0.3
        with:
          publish_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
