name: Action version updater
on:
  release:
    types: [published]

jobs:
  actions-tagger:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Actions-R-Us/actions-tagger@v2.0.3
        with:
          publish_latest: true
        env:
          GITHUB_TOKEN: '${{secrets.GITHUB_TOKEN}}'